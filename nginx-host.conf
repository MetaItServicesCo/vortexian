# Host Nginx config for vortexiantech.com
# Goes into /etc/nginx/sites-available/vortexiantech.com
# Then symlink: ln -s /etc/nginx/sites-available/vortexiantech.com /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name vortexiantech.com www.vortexiantech.com;

    # Will be auto-modified by Certbot to redirect to HTTPS
    client_max_body_size 50M;

    location / {
        # Forward everything to Docker running on localhost:8080
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_cache_bypass $http_upgrade;
    }
}
